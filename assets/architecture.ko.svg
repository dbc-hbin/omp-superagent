<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="architecture-title architecture-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', 'Segoe UI', sans-serif">
  <title id="architecture-title">상시 실행 서비스 하나, OMP 헤드 하나, 독립 레인 세션</title>
  <desc id="architecture-desc">Discord, Telegram, Slack은 상시 실행되는 Gateway 서비스에 연결됩니다. 모든 입력은 OMP 헤드 에이전트 세션으로 전달되며, 헤드는 직접 판단하고 작업하거나 레인 A와 레인 B의 독립 저장소·주제 세션을 제어합니다. 레인 제어는 헤드만 합니다. 레인 결과는 헤드와 Gateway를 거쳐 메신저로 돌아갑니다. 헤드와 레인은 정보 게시판을 공유하며, 점선 연결은 명령 경로가 아닙니다.</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e23cb4"/><stop offset="0.5" stop-color="#9c4ffb"/><stop offset="1" stop-color="#22b8d4"/></linearGradient>
    <marker id="flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 10 5 0 10Z" fill="#6f6787"/></marker>
    <marker id="control-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 10 5 0 10Z" fill="#8f3ff0"/></marker>
  </defs>
  <rect x="1" y="1" width="958" height="428" rx="20" fill="#fdfcff" stroke="#e6e0f0"/>
  <rect x="24" y="24" width="36" height="6" rx="3" fill="url(#hero)"/>
  <text x="24" y="60" font-size="24" font-weight="700" fill="#1d1530">서비스 하나, 헤드 하나, 독립 레인</text>
