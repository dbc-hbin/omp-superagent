<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="architecture-title architecture-desc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <title id="architecture-title">One always-on service, one OMP head, independent lane sessions</title>
  <desc id="architecture-desc">Discord, Telegram, and Slack connect to the always-on Gateway service. All input passes to the OMP Head agent session, which decides and works directly or controls independent repository or topic sessions in Lane A and Lane B. Only the head controls lanes. Lane results return through the head and Gateway to the messengers. The head and lanes share an informational board; dashed connections are not a command bus.</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e23cb4"/><stop offset="0.5" stop-color="#9c4ffb"/><stop offset="1" stop-color="#22b8d4"/></linearGradient>
    <marker id="flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 10 5 0 10Z" fill="#6f6787"/></marker>
    <marker id="control-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 10 5 0 10Z" fill="#8f3ff0"/></marker>
  </defs>
  <rect x="1" y="1" width="958" height="428" rx="20" fill="#fdfcff" stroke="#e6e0f0"/>
  <rect x="24" y="24" width="36" height="6" rx="3" fill="url(#hero)"/>
  <text x="24" y="60" font-size="24" font-weight="700" fill="#1d1530">One service. One head. Independent lanes.</text>
  <g aria-hidden="true">
    <path d="M184 170H224" fill="none" stroke="#6f6787" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#flow-arrow)"/>
    <path d="M398 170H446" fill="none" stroke="#6f6787" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#flow-arrow)"/>
    <path d="M446 242H398" fill="none" stroke="#6f6787" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#flow-arrow)"/>
    <path d="M224 242H184" fill="none" stroke="#6f6787" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#flow-arrow)"/>
    <path d="M638 164H684V122H754" fill="none" stroke="#8f3ff0" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#control-arrow)"/>
    <path d="M754 162H714V200H638" fill="none" stroke="#6f6787" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#flow-arrow)"/>
    <path d="M638 234H714V266H754" fill="none" stroke="#8f3ff0" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#control-arrow)"/>
    <path d="M754 306H684V258H638" fill="none" stroke="#6f6787" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#flow-arrow)"/>
    <path d="M542 274V370" fill="none" stroke="#8b82a3" stroke-width="1.6" stroke-dasharray="5 5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M936 122H948V392H936" fill="none" stroke="#8b82a3" stroke-width="1.6" stroke-dasharray="5 5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M846 338V370" fill="none" stroke="#8b82a3" stroke-width="1.6" stroke-dasharray="5 5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g>
    <rect x="24" y="132" width="160" height="142" rx="14" fill="#ffffff" stroke="#cfc7de" stroke-width="1.5"/>
    <text x="104" y="165" font-size="22" font-weight="700" text-anchor="middle" fill="#1d1530">Messengers</text>
    <text x="104" y="197" font-size="16" text-anchor="middle" fill="#5c5470">Discord</text>
    <text x="104" y="221" font-size="16" text-anchor="middle" fill="#5c5470">Telegram</text>
    <text x="104" y="245" font-size="16" text-anchor="middle" fill="#5c5470">Slack</text>
  </g>
  <g>
    <rect x="224" y="132" width="174" height="142" rx="14" fill="#ffffff" stroke="#cfc7de" stroke-width="1.5"/>
    <text x="311" y="171" font-size="22" font-weight="700" text-anchor="middle" fill="#1d1530">Gateway</text>
    <text x="311" y="201" font-size="16" text-anchor="middle" fill="#5c5470">always-on service</text>
    <text x="311" y="231" font-size="16" text-anchor="middle" fill="#5c5470">admit · route · reply</text>
  </g>
  <g>
    <rect x="446" y="132" width="192" height="142" rx="14" fill="#faf3ff" stroke="url(#hero)" stroke-width="2.5"/>
    <rect x="470" y="129" width="144" height="6" rx="3" fill="url(#hero)"/>
    <text x="542" y="167" font-size="22" font-weight="700" text-anchor="middle" fill="#7a2bd6">OMP Head</text>
    <text x="542" y="195" font-size="16" text-anchor="middle" fill="#5c5470">agent session</text>
    <text x="542" y="222" font-size="16" text-anchor="middle" fill="#5c5470">decides · works</text>
    <text x="542" y="250" font-size="15" font-weight="600" text-anchor="middle" fill="#7a2bd6">Head-only lane control</text>
  </g>
  <g>
    <rect x="754" y="80" width="182" height="108" rx="14" fill="#ffffff" stroke="#cfc7de" stroke-width="1.5"/>
    <rect x="802" y="77" width="86" height="6" rx="3" fill="#22b8d4"/>
    <text x="845" y="111" font-size="22" font-weight="700" text-anchor="middle" fill="#1d1530">Lane A</text>
    <text x="845" y="138" font-size="16" text-anchor="middle" fill="#5c5470">independent session</text>
    <text x="845" y="165" font-size="16" text-anchor="middle" fill="#5c5470">repo / topic A</text>
  </g>
  <g>
    <rect x="754" y="230" width="182" height="108" rx="14" fill="#ffffff" stroke="#cfc7de" stroke-width="1.5"/>
    <rect x="802" y="227" width="86" height="6" rx="3" fill="#22b8d4"/>
    <text x="845" y="261" font-size="22" font-weight="700" text-anchor="middle" fill="#1d1530">Lane B</text>
    <text x="845" y="288" font-size="16" text-anchor="middle" fill="#5c5470">independent session</text>
    <text x="845" y="315" font-size="16" text-anchor="middle" fill="#5c5470">repo / topic B</text>
  </g>
  <text x="249" y="304" font-size="15" fill="#5c5470">Replies via head</text>
  <text x="650" y="219" font-size="15" fill="#5c5470">results</text>
  <text x="695" y="295" font-size="15" fill="#5c5470">results</text>
  <text x="553" y="325" font-size="15" fill="#5c5470">status / context</text>
  <g>
    <rect x="446" y="370" width="490" height="44" rx="12" fill="#f5f1fb" stroke="#8b82a3" stroke-width="1.2" stroke-dasharray="5 5"/>
    <text x="466" y="398" font-size="18" font-weight="700" fill="#1d1530">Shared board</text>
    <text x="609" y="398" font-size="15" fill="#5c5470">information only · not control</text>
  </g>
</svg>
