    <text x="104" y="197" font-size="16" text-anchor="middle" fill="#5c5470">Discord</text>
    <text x="104" y="221" font-size="16" text-anchor="middle" fill="#5c5470">Telegram</text>
    <text x="104" y="245" font-size="16" text-anchor="middle" fill="#5c5470">Slack</text>
  </g>
