    <text x="845" y="138" font-size="16" text-anchor="middle" fill="#5c5470">독립 세션</text>
    <text x="845" y="165" font-size="16" text-anchor="middle" fill="#5c5470">저장소 / 주제 A</text>
  </g>
  <g>
