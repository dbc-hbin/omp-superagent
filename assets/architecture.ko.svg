  <text x="650" y="219" font-size="15" fill="#5c5470">결과</text>
  <text x="695" y="295" font-size="15" fill="#5c5470">결과</text>
  <text x="553" y="325" font-size="15" fill="#5c5470">상태 / 맥락</text>
  <g>
    <rect x="446" y="370" width="490" height="44" rx="12" fill="#f5f1fb" stroke="#8b82a3" stroke-width="1.2" stroke-dasharray="5 5"/>
    <text x="466" y="398" font-size="18" font-weight="700" fill="#1d1530">공유 게시판</text>
    <text x="586" y="398" font-size="15" fill="#5c5470">정보 공유 전용 · 제어 아님</text>
